<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" class="w-full h-full">
  <defs>
    <!-- گرادیان برای کارت‌ها - رنگ‌های نئونی و مدرن -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <!-- سایه -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- پس‌زمینه با گوشه‌های گرد -->
  <rect x="10" y="10" width="180" height="180" rx="35" fill="#FAFAFA" filter="url(#shadow)"/>
  
  <!-- کارت پشتی (چپ) با ایموجی ♥️ -->
  <rect x="50" y="55" width="55" height="80" rx="8" fill="url(#cardGrad1)" transform="rotate(-15 77.5 95)" opacity="0.9"/>
  <text x="77.5" y="100" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" transform="rotate(-15 77.5 95)">♥️</text>
  
  <!-- کارت میانی با ایموجی 🛡️ -->
  <rect x="72.5" y="50" width="55" height="80" rx="8" fill="url(#cardGrad2)" transform="rotate(0 100 90)" opacity="0.95"/>
  <text x="100" y="98" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🛡️</text>
  
  <!-- کارت جلویی (راست) با ایموجی 👑 -->
  <rect x="95" y="55" width="55" height="80" rx="8" fill="url(#cardGrad3)" transform="rotate(15 122.5 95)"/>
  <text x="122.5" y="100" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" transform="rotate(15 122.5 95)">👑</text>
  
  <!-- متن UNO - پایین‌تر، کوچکتر و با سایه -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" style="filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));">UNO</text>
</svg>